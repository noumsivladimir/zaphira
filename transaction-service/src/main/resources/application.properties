spring.application.name=transaction-service
server.port=8085

# Central infra endpoints
infra.db.host=${DB_HOST:192.168.100.4}
infra.db.port=${DB_PORT:5432}
infra.kafka.bootstrap=${KAFKA_BOOTSTRAP:192.168.100.4:9092}

transaction.db.name=${TRANSACTION_DB_NAME:zaphira_transactions_db}
transaction.db.user=${TRANSACTION_DB_USER:zaphira_transaction_service}
transaction.db.password=${TRANSACTION_DB_PASSWORD:TransactionService2026!Secure}

# PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://${infra.db.host}:${infra.db.port}/${transaction.db.name}
spring.datasource.username=${transaction.db.user}
spring.datasource.password=${transaction.db.password}

# JPA / Hibernate config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ✅ JWT Configuration
app.jwt.secret=7pBJFFNs9RzeTwTz/NHFY1e1QyFVnDoZbBTG8zsdGHeAsAzmqcxLneWASllVgTbAdgdrS+XhAR9nfg1hPglA3Q==
app.jwt.access-expiration=900000
# 15s
app.jwt.refresh-expiration=2592000000    
# 30 days

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG


# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========== LIQUIBASE ==========
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Wallet service integration
wallet.service.base-url=
wallet.service.wallet-details-path=/api/wallets/{walletNumber}
wallet.service.transfer-path=/api/wallets/transfer
wallet.service.timeout-ms=5000

# Transaction limits & authorization
transaction.limits.per-transaction=5000
transaction.limits.daily=20000
transaction.limits.weekly=50000
transaction.limits.monthly=150000
transaction.limits.authorization-threshold=1000
transaction.limits.authorization.expiry=PT5M
transaction.limits.authorization.default-mode=OTP
transaction.limits.authorization.expose-challenge-in-response=true

# Fees
transaction.fees.fixed=0
transaction.fees.percentage=0.005
transaction.fees.max=2000
transaction.fees.currency=XOF

# Kafka Configuration
spring.kafka.enabled=true
spring.kafka.bootstrap-servers=${infra.kafka.bootstrap}
# Disable auto-configuration of Kafka listeners to prevent automatic topic subscription
spring.kafka.listener.ack-mode=manual
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=transaction-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.type.mapping=transactionEvent:com.zaphira.transaction.event.TransactionEvent
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.zaphira.transaction.event.TransactionEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.zaphira.transaction.event.TransactionEvent
spring.kafka.consumer.properties.spring.json.type.mapping=transactionEvent:com.zaphira.transaction.event.TransactionEvent

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# ========== FEIGN CLIENT ==========
wallet.service.url=http://localhost:8083

feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000
feign.client.config.default.logger-level=full

feign.client.config.wallet-service.connect-timeout=3000
feign.client.config.wallet-service.read-timeout=8000
feign.client.config.wallet-service.logger-level=full

feign.compression.request.enabled=true
feign.compression.response.enabled=true

# ========== RESILIENCE4J ==========
resilience4j.circuitbreaker.instances.walletService.register-health-indicator=true
resilience4j.circuitbreaker.instances.walletService.sliding-window-size=10
resilience4j.circuitbreaker.instances.walletService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.walletService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.walletService.failure-rate-threshold=50

resilience4j.retry.instances.walletService.max-attempts=3
resilience4j.retry.instances.walletService.wait-duration=1s
resilience4j.retry.instances.walletService.exponential-backoff-multiplier=2

# ========== REDIS ==========
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# ========== ACTUATOR ==========
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# ========== LOGGING ==========
logging.level.root=INFO
logging.level.com.zaphira.transaction=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.feign=DEBUG

logging.file.name=logs/transaction-service.log
logging.file.max-size=10MB
logging.file.max-history=30

# ========== SERVER ==========
server.error.include-message=always
server.error.include-binding-errors=always


spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration