spring.application.name=transaction-service
server.port=8083

# PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://192.168.0.122:5432/wallet_db
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA / Hibernate config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ✅ JWT Configuration
app.jwt.secret=7pBJFFNs9RzeTwTz/NHFY1e1QyFVnDoZbBTG8zsdGHeAsAzmqcxLneWASllVgTbAdgdrS+XhAR9nfg1hPglA3Q==
app.jwt.access-expiration=900000
# 15s
app.jwt.refresh-expiration=2592000000    
# 30 days

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG

# Wallet service integration
wallet.service.base-url=
wallet.service.wallet-details-path=/api/wallets/{walletNumber}
wallet.service.transfer-path=/api/wallets/transfer
wallet.service.timeout-ms=5000

# Transaction limits & authorization
transaction.limits.per-transaction=500000
transaction.limits.daily=2000000
transaction.limits.weekly=5000000
transaction.limits.monthly=150000000
transaction.limits.authorization-threshold=1000
transaction.limits.authorization.expiry=PT5M
transaction.limits.authorization.default-mode=OTP
transaction.limits.authorization.expose-challenge-in-response=true

# Fees
transaction.fees.fixed=0
transaction.fees.percentage=0.005
transaction.fees.max=2000
transaction.fees.currency=XOF

# Kafka Configuration
spring.kafka.bootstrap-servers=192.168.0.122:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=transaction-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Validation Results Consumer (spécifique)
kafka.validation.consumer.group-id=transaction-service-validation-result
kafka.validation.consumer.topics=transaction.validation.result
kafka.validation.consumer.max-poll-records=10
kafka.validation.consumer.session-timeout-ms=30000
kafka.validation.consumer.enable-auto-commit=false

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ============================================================================
# FEATURE FLAG: Async Kafka Validation (Phase 3)
# ============================================================================
# Controls progressive rollout of async validation via Kafka
# Default: DISABLED (safe production mode)

# Enable/disable async validation (true = enabled, false = disabled/safe mode)
validation.feature.enabled=false

# Percentage of traffic to route through Kafka validation (0-100)
# 0% = no traffic (safe mode)
# 10% = canary/initial testing
# 50% = half traffic
# 100% = full rollout
# Only applied when enabled=true
validation.feature.traffic-percentage=0

# Timeout for validation results in seconds (default: 300 = 5 minutes)
validation.feature.validation-timeout-seconds=300

# Enable automatic cleanup of expired validations (default: true)
validation.feature.enable-auto-cleanup=true
