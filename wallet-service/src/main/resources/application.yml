server:
  port: 8083

infra:
  db:
    host: ${DB_HOST:192.168.100.4}
    port: ${DB_PORT:5432}
  kafka:
    bootstrap: ${KAFKA_BOOTSTRAP:192.168.100.4:9092}

wallet:
  db:
    name: ${WALLET_DB_NAME:zaphira_wallets_db}
    user: ${WALLET_DB_USER:zaphira_wallet_service}
    password: ${WALLET_DB_PASSWORD:WalletService2026!Secure}


logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.engine.jdbc.batch.internal.BatchingBatch: DEBUG

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-demo-secret-change-me}

spring:
  application:
    name: wallet-service
  datasource:
    url: jdbc:postgresql://${infra.db.host}:${infra.db.port}/${wallet.db.name}
    username: ${wallet.db.user}
    password: ${wallet.db.password}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  kafka:
    bootstrap-servers: ${infra.kafka.bootstrap}
    consumer:
      group-id: wallet-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Ajouter cette section
kafka:
  topics:
    user-created: user-created-topic
    wallet-created: wallet-created-topic

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    should-unregister-on-shutdown: true