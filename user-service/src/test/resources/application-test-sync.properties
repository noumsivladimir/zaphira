# ===========================================
# SQLite Configuration for Test Environment
# ===========================================

spring.application.name=user-service
server.port=8082

# =========================================
# SQLite (H2) Database Configuration
# =========================================
spring.datasource.url=jdbc:h2:mem:usertest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# =========================================
# Kafka Configuration (Mock/Disabled)
# =========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka Topics
kafka.topics.user-created=user-created-topic
kafka.topics.wallet-created=wallet-created-topic

# =========================================
# Feign Synchronous Test Configuration
# =========================================
wallet.service.url=http://localhost:8086
auth.service.url=http://localhost:8089

# Feign Timeout
feign.client.config.default.connectTimeout=2000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=full

# =========================================
# Logging Configuration
# =========================================
logging.level.root=INFO
logging.level.com.zaphira=DEBUG
logging.level.org.springframework.test=DEBUG
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =========================================
# Eureka (Disabled for Tests)
# =========================================
eureka.client.enabled=false

# =========================================
# Actuator
# =========================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
