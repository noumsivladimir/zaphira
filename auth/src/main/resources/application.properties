spring.application.name=auth-service
server.port=8081

# Central infra endpoints
infra.db.host=${DB_HOST:192.168.100.4}
infra.db.port=${DB_PORT:5432}
infra.kafka.bootstrap=${KAFKA_BOOTSTRAP:192.168.100.4:9092}

auth.db.name=${AUTH_DB_NAME:zaphira_auth_db}
auth.db.user=${AUTH_DB_USER:zaphira_auth_service}
auth.db.password=${AUTH_DB_PASSWORD:AuthService2026!Secure}

# PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://${infra.db.host}:${infra.db.port}/${auth.db.name}
spring.datasource.username=${auth.db.user}
spring.datasource.password=${auth.db.password}

# JPA / Hibernate config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ✅ JWT Configuration
app.jwt.secret=7pBJFFNs9RzeTwTz/NHFY1e1QyFVnDoZbBTG8zsdGHeAsAzmqcxLneWASllVgTbAdgdrS+XhAR9nfg1hPglA3Q==
app.jwt.access-expiration=900000
# 15s
app.jwt.refresh-expiration=2592000000    
# 30 days

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG

# Eureka Client
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Feign Client Configuration
feign.hystrix.enabled=false
feign.circuitbreaker.enabled=true
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000

# URL du Wallet Service (service discovery)
wallet.service.url=http://wallet-service

# Kafka Configuration
spring.kafka.bootstrap-servers=${infra.kafka.bootstrap}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=auth-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

