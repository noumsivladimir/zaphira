spring.application.name=auth-service
server.port=8081

# PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://192.168.0.122:5432/wallet_db
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA / Hibernate config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ✅ JWT Configuration
app.jwt.secret=7pBJFFNs9RzeTwTz/NHFY1e1QyFVnDoZbBTG8zsdGHeAsAzmqcxLneWASllVgTbAdgdrS+XhAR9nfg1hPglA3Q==
app.jwt.access-expiration=900000
# 15s
app.jwt.refresh-expiration=2592000000    
# 30 days

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Feign Client Configuration
feign.hystrix.enabled=false
feign.circuitbreaker.enabled=true
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000

# URL du Wallet Service
wallet.service.url=http://localhost:8082

