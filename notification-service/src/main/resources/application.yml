twilio:
  account-sid: "AC4ee2203ca9ee74fe8df3010675a03cd2"
  auth-token: "c94f6cac374ebe85351766659a3ced4b"
  from-number: "+17177897813"

otp:
  ttl-minutes: 10
  max-tokens-per-user: 5  # Limite le nombre de tokens actifs par utilisateur
  cleanup:
    enabled: true
    interval-minutes: 5    # Nettoyage toutes les 5 minutes
    deep-cleanup-hours: 1  # Nettoyage profond toutes les heures

server:
  port: 8089

infra:
  db:
    host: ${DB_HOST:192.168.100.4}
    port: ${DB_PORT:5432}

notification:
  db:
    name: ${NOTIFICATION_DB_NAME:zaphira_notifications_db}
    user: ${NOTIFICATION_DB_USER:zaphira_notification_service}
    password: ${NOTIFICATION_DB_PASSWORD:NotificationService2026!Secure}

spring:
  # PostgreSQL configuration (same as user-service)
  datasource:
    url: jdbc:postgresql://${infra.db.host}:${infra.db.port}/${notification.db.name}
    username: ${notification.db.user}
    password: ${notification.db.password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

