twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:AC4ee2203ca9ee74fe8df3010675a03cd2}
  auth-token: ${TWILIO_AUTH_TOKEN:c94f6cac374ebe85351766659a3ced4b}
  from-number: ${TWILIO_FROM_NUMBER:+17177897813}

otp:
  ttl-minutes: 10
  max-tokens-per-user: 5  # Limite le nombre de tokens actifs par utilisateur
  cleanup:
    enabled: true
    interval-minutes: 5    # Nettoyage toutes les 5 minutes
    deep-cleanup-hours: 1  # Nettoyage profond toutes les heures

server:
  port: 8089

infra:
  db:
    host: ${DB_HOST:192.168.100.4}
    port: ${DB_PORT:5432}
  kafka:
    bootstrap: ${KAFKA_BOOTSTRAP:192.168.100.4:9092}

notification:
  db:
    name: ${NOTIFICATION_DB_NAME:zaphira_notifications_db}
    user: ${NOTIFICATION_DB_USER:zaphira_notification_service}
    password: ${NOTIFICATION_DB_PASSWORD:NotificationService2026!Secure}

spring:
  # PostgreSQL configuration (same as user-service)
  datasource:
    url: jdbc:postgresql://${infra.db.host}:${infra.db.port}/${notification.db.name}
    username: ${notification.db.user}
    password: ${notification.db.password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # Kafka Configuration
  kafka:
    enabled: true
    bootstrap-servers: ${infra.kafka.bootstrap}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Topics
kafka:
  topics:
    otp-sms-request: otp-sms-request
    otp-sms-result: otp-sms-result

