# Test Synchronous Profile Configuration
# Replaces Kafka with Feign for synchronous inter-service communication
# Replaces PostgreSQL with H2 SQLite

# ==================== Server ====================
server.port=8080

# ==================== H2 Database ====================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==================== JPA/Hibernate ====================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==================== Logging ====================
logging.level.root=WARN
logging.level.com.zaphira=INFO
logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.org.springframework.web=WARN

# ==================== Feign Clients ====================
test.sync.user-service.url=http://localhost:8082
test.sync.wallet-service.url=http://localhost:8086
test.sync.transaction-service.url=http://localhost:8081
test.sync.notification-service.url=http://localhost:8085

# ==================== Spring Cloud ====================
spring.cloud.discovery.enabled=false

# Disable Kafka for test mode
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=test-group
