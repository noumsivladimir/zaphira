version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zaphira-postgres
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zaphira-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zaphira-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - zaphira-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: zaphira-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - zaphira-network

  eureka-server:
    build:
      context: ../service-registry
      dockerfile: Dockerfile
    container_name: zaphira-eureka
    ports:
      - "8761:8761"
    networks:
      - zaphira-network

  config-server:
    build:
      context: ../config-server
      dockerfile: Dockerfile
    container_name: zaphira-config
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server
    networks:
      - zaphira-network

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: zaphira-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - config-server
    networks:
      - zaphira-network

  auth-service:
    build:
      context: ../auth
      dockerfile: Dockerfile
    container_name: zaphira-auth
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - eureka-server
      - config-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet_db
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - zaphira-network

  wallet-service:
    build:
      context: ../wallet-service
      dockerfile: Dockerfile
    container_name: zaphira-wallet
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - kafka
      - eureka-server
      - config-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - zaphira-network

  transaction-service:
    build:
      context: ../transaction-service
      dockerfile: Dockerfile
    container_name: zaphira-transaction
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - kafka
      - eureka-server
      - config-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - zaphira-network

  notification-service:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    container_name: zaphira-notification
    ports:
      - "8084:8084"
    depends_on:
      - postgres
      - kafka
      - eureka-server
      - config-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - zaphira-network

volumes:
  postgres_data:

networks:
  zaphira-network:
    driver: bridge

